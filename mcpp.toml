glob = "**/highgui/src/window_gtk.cpp"
cxxflags = ["-pthread"]

[features.highgui-gtk3]
implies = ["highgui", "imgcodecs"]

[[features.highgui-gtk3.flags]]
glob = "**/highgui/src/window_gtk.cpp"
cxxflags = ["-pthread"]

[features.highgui-win32]
implies = ["highgui"]

[features.highgui-cocoa]
implies = ["highgui"]

[features.dnn-onnxruntime]
implies = ["dnn"]
defines = ["HAVE_ONNXRUNTIME=1"]

[feature-deps]

[feature-deps.videoio-ffmpeg]

[feature-deps.videoio-ffmpeg.compat]
ffmpeg = "8.1.2"

[feature-deps.imgcodecs-webp]

[feature-deps.imgcodecs-webp.compat]

[feature-deps.imgcodecs-webp.compat.libwebp]
version = "1.5.0"
features = ["demux", "mux"]

[feature-deps.dnn-onnxruntime]

[feature-deps.dnn-onnxruntime."mcpplibs.mwrap"]
onnxruntime = "1.25.1"

[targets]

[targets.opencv]
kind = "lib"
