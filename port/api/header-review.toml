[[groups]]
decision = "partial-native"
reason = "The optional core.simd surface implements native 128-bit APIs with original types. Linux GCC16/LLVM22/LLVM23 SDK parity, all-main-module composition and GCC release tests pass. ARM64/Windows native CI and complete mode coverage remain required; this is not a completed family-wide acceptance record."
headers = [
  "modules/core/include/opencv2/core/hal/intrin.hpp",
  "modules/core/include/opencv2/core/hal/intrin_forward.hpp",
  "modules/core/include/opencv2/core/hal/intrin_math.hpp",
  "modules/core/include/opencv2/core/hal/intrin_neon.hpp",
  "modules/core/include/opencv2/core/hal/intrin_sse.hpp",
  "modules/core/include/opencv2/core/hal/intrin_sse_em.hpp",
  "modules/core/include/opencv2/core/hal/simd_utils.impl.hpp",
  "modules/core/include/opencv2/core/simd_intrinsics.hpp",
]

[[groups]]
decision = "partial"
reason = "The optional simd-emulated mode imports original generic SDK templates with scoped namespace-function linkage adaptation. SDK/module parity and direct/root lookup pass on Linux GCC16/LLVM22/LLVM23. Current native CI and all-main-module composition remain required; the original reinterpret_uint instantiation failure is independently preserved."
headers = [
  "modules/core/include/opencv2/core/hal/intrin_cpp.hpp",
]

[[groups]]
decision = "partial"
reason = "The explicit core.simd.legacy module re-exports all 21 original cv::hal operator templates. Native/software SDK parity, reference identity, saturation and root/base opt-in boundaries pass GCC16/LLVM22/LLVM23; GCC release software parity passes too. Native platform CI and full composition remain required. The original software floating v_not link failure is preserved."
headers = [
  "modules/core/include/opencv2/core/hal/intrin_legacy_ops.h",
]

[[groups]]
decision = "public-gap"
reason = "Other architecture/ISA implementations still need explicit module integration and applicable verification. Native 128-bit, software mode and legacy operator support do not certify these modes."
headers = [
  "modules/core/include/opencv2/core/hal/intrin_avx.hpp",
