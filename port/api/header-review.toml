]

[[groups]]
decision = "textual-only"
reason = "Build CPU dispatch selection macros have no standalone public declarations to import."
headers = [
  "modules/core/include/opencv2/core/cv_cpu_helper.h",
]

[[groups]]
decision = "textual-only"
reason = "Public trace region/argument macros are control-flow instrumentation. Supporting details are explicitly @cond IGNORED; callers need the textual trace header before imports."
headers = [
  "modules/core/include/opencv2/core/utils/trace.hpp",
]

[[groups]]
decision = "textual-only"
reason = "Layer registration declaration macros construct private registrars; callers can use the exported LayerFactory C++ API. Macro-based declarations require the upstream textual header and supported mixing order."
headers = [
  "modules/dnn/include/opencv2/dnn/layer.details.hpp",
]

[[groups]]
decision = "binding-only"
reason = "Header explicitly says functions are for bindings only and directs C++ callers to HoughLines/HoughCircles, which are exported."
headers = [
  "modules/imgproc/include/opencv2/imgproc/bindings.hpp",
]

[[groups]]
decision = "implemented"
reason = "Twelve public dump helpers use exact SDK forwards; eight external array/vector/cache helpers retain original declarations. Independent native/module consumers cover formatting and array diagnostics on all three Linux compilers. The ignored binding-test region is not exported."
headers = [
  "modules/core/include/opencv2/core/bindings_utils.hpp",
]

[[groups]]
decision = "implemented"
reason = "The original global InpaintingModes type and six global legacy constants are exported from photo/video with using declarations. Direct module tests compare their original values and modern C++ equivalents."
headers = [
  "modules/photo/include/opencv2/photo/legacy/constants_c.h",
  "modules/video/include/opencv2/video/legacy/constants_c.h",
]

[[groups]]
decision = "implemented"
reason = "Original cvhalKeyPoint is included and re-exported from the features facade. HAL values are mapped in the macros module; native consumer coverage is required on the new checkpoint."
headers = [
  "modules/features/include/opencv2/features/hal/interface.h",
]

[[groups]]
decision = "typed-mapped"
reason = "Header contains pure CV_HAL_* macro constants only. The macros module and optional textual bridge include this header and map each value without enabling an image-processing backend."
headers = [
  "modules/imgproc/include/opencv2/imgproc/hal/interface.h",
]

[[groups]]
